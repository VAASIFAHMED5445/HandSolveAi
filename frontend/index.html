<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HandSolveAI</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        transition: background 0.8s ease-in-out;
    }

    .container {
        width: 420px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0px 6px 20px rgba(0,0,0,0.15);
        backdrop-filter: blur(10px);
        animation: fadeIn 1s ease;
    }

    h1 {
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 20px;
    }

    input[type="file"] {
        margin-bottom: 15px;
    }
    /* Fade-in animation */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        font-weight: bold;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button:hover {
        opacity: 0.85;
        transform: scale(1.05);
        box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
    }

    .result {
        margin-top: 25px;
        padding: 15px;
        border-radius: 8px;
        background: #f9f9f9;
        opacity: 1;
        transform: translateY(0);
    }

    .label {
        font-weight: bold;
        margin-top: 10px;
    }

    .value {
        margin-bottom: 10px;
        font-weight: bold;
    }

    .footer {
        margin-top: 20px;
        font-size: 12px;
        opacity: 0.7;
    }
    .result.show {
        opacity: 1;
        transform: translateY(0);
    }
    #stepsText {
    transition: all 0.5s ease;
    }
    /* Spinner container */
#loadingSpinner {
    margin-top: 20px;
}

/* Spinner animation */
.spinner {
    margin: 10px auto;
    width: 40px;
    height: 40px;
    border: 5px solid #ddd;
    border-top: 5px solid #333;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

/* Spin keyframes */
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

    <div class="container">

        <h1>HandSolveAI 🤖</h1>
        <p>Upload an image of a math equation and get the solution instantly.</p>

        <input type="file" id="imageInput">
        <br>
        <button onclick="uploadImage()">Solve Equation</button>
        <div id="loadingSpinner" style="display:none;">
            <div class="spinner"></div>
            <p>Solving your equation...</p>
        </div>

        <div class="result">
            <div>
                <div class="label">Detected Equation:</div>
                <div id="detectedText" class="value">---</div>
            </div>

            <div>
                <div class="label">Solution:</div>
                <div id="solutionText" class="value">---</div>
            </div>
            <div>
                <div class="label">Step-by-Step Solution:</div>
                <div id="stepsText" class="value"></div>
            </div>
        </div>

        <div class="footer">
            Built using OCR + AI Solver 🚀
        </div>

    </div>

    <script>
    async function uploadImage() {
        const fileInput = document.getElementById("imageInput");
        const file = fileInput.files[0];

        if (!file) {
            alert("Please select an image first!");
            return;
        }

        const formData = new FormData();
        formData.append("image", file);
        document.getElementById("solutionText").innerText = "Solving...";
        document.getElementById("stepsText").innerText = "";
        document.getElementById("loadingSpinner").style.display = "block";
        document.querySelector(".result").style.display = "none";

        const response = await fetch("http://127.0.0.1:5000/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        // Animate result box
        const resultBox = document.querySelector(".result");
        resultBox.classList.remove("show");
        setTimeout(() => {
            resultBox.classList.add("show");
        }, 100);
        document.getElementById("loadingSpinner").style.display = "none";
        document.querySelector(".result").style.display = "block";

        // Show detected text
        document.getElementById("detectedText").innerText =
            data.detected_text || "Not detected";

        // Show solution
        document.getElementById("solutionText").innerText =
            data.solution || "No solution";

        // Show steps
        if (data.steps && data.steps.length > 0) {
            document.getElementById("stepsText").innerHTML =
                data.steps.map(step => "➡ " + step).join("<br>");
        } else {
            document.getElementById("stepsText").innerText = "No steps available";
        }
    }

    // 🎨 Random Theme Function
    function setRandomTheme() {
        const gradients = [
            ["#667eea", "#764ba2"],
            ["#ff7e5f", "#feb47b"],
            ["#43cea2", "#185a9d"],
            ["#f7971e", "#ffd200"],
            ["#00c6ff", "#0072ff"],
            ["#ff6a00", "#ee0979"],
            ["#11998e", "#38ef7d"]
        ];

        const random = gradients[Math.floor(Math.random() * gradients.length)];

        // Background gradient
        document.body.style.background =
            `linear-gradient(135deg, ${random[0]}, ${random[1]})`;

        // Button color
        document.querySelector("button").style.background = random[0];

        // Text highlight color
        document.querySelectorAll(".value").forEach(el => {
            el.style.color = random[1];
        });
        document.querySelector(".spinner").style.borderTop =
            `5px solid ${random[0]}`;
    }

    // Run when page loads
    window.onload = setRandomTheme;
</script>
